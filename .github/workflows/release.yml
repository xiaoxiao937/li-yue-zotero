name: Publish Zotero release

on:
  push:
    branches: [main]
    paths:
      - "dist/li-yue-*.xpi"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest package
        id: package
        shell: bash
        run: |
          file=$(find dist -maxdepth 1 -type f -name 'li-yue-*.xpi' -print | sort -V | tail -n 1)
          test -n "$file"
          version=${file#dist/li-yue-}
          version=${version%.xpi}
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.package.outputs.file }}
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          notes=$(cat <<EOF
          狸阅 ${VERSION}：免费、非商业的 Zotero 多文献独立 AI 阅读工具。

          - 支持 Zotero 9.0.x
          - 用户使用自己的 DeepSeek、OpenAI 或兼容 API Key
          - 每篇文献独立生成对应子笔记
          - 隐私与安全说明见仓库中的 PRIVACY.md 和 SECURITY.md

          SHA-256: `${SHA256}`
          EOF
          )
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$FILE" --clobber
          else
            gh release create "v${VERSION}" "$FILE" \
              --title "狸阅 v${VERSION}" \
              --notes "$notes" \
              --latest
          fi
