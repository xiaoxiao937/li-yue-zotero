name: Publish Zotero release

on:
  push:
    branches: [main]
    paths:
      - "dist/li-yue-*.xpi"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest package
        id: package
        shell: bash
        run: |
          file=$(find dist -maxdepth 1 -type f -name 'li-yue-*.xpi' -print | sort -V | tail -n 1)
          test -n "$file"
          version=${file#dist/li-yue-}
          version=${version%.xpi}
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.package.outputs.file }}
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          notes_file="RELEASE_NOTES_${VERSION}.md"
          if test -f "$notes_file"; then
            cp "$notes_file" /tmp/li-yue-release-notes.md
          else
            printf '%s\n' "狸阅 ${VERSION} 更新。" > /tmp/li-yue-release-notes.md
          fi
          printf '\nSHA-256: %s\n' "$SHA256" >> /tmp/li-yue-release-notes.md
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$FILE" --clobber
            gh release edit "v${VERSION}" \
              --title "狸阅 v${VERSION}" \
              --notes-file /tmp/li-yue-release-notes.md \
              --latest
          else
            gh release create "v${VERSION}" "$FILE" \
              --title "狸阅 v${VERSION}" \
              --notes-file /tmp/li-yue-release-notes.md \
              --latest
          fi
